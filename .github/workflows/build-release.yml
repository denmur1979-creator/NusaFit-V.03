
name: NusaFit Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil kode dari repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Siapkan Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 3. Siapkan Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Instal Android SDK 36
      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "platform-tools"

      # 5. Periksa struktur proyek
      - name: Check Project Files
        run: |
          echo "Isi root repository:"
          ls -la

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan"
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts tidak ditemukan"
            exit 1
          fi

      # 6. Siapkan Gradle 8.13
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # 7. Buat Gradle Wrapper jika belum ada
      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew tidak ditemukan."
            echo "Membuat Gradle Wrapper..."
            gradle wrapper --gradle-version 8.13
          fi

          chmod +x ./gradlew
          ls -la ./gradlew

      # 8. Periksa versi Gradle
      - name: Check Gradle
        run: ./gradlew --version

      # 9. Build APK Debug
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 10. Build APK Release
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 11. Simpan APK Debug
      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      # 12. Simpan APK Release
      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
